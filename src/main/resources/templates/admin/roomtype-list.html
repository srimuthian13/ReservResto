<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>Daftar Tipe Ruangan | Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-room-list.css}">
</head>

<body>
    <header>
        <h1>Daftar Tipe Ruangan</h1>

    </header>
    <div th:replace="~{fragments/admin-navbar :: navbar}"></div>

    <div class="wrapper">

        <a th:href="@{/admin/roomtypes/add}" class="btn btn-add">+ Tambah Data Ruangan</a>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 100px;">Foto</th>
                        <th>Tipe Ruangan</th>
                        <th>Lokasi</th>
                        <th>Harga</th>
                        <th style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${roomTypes}">
                        <td th:text="'#' + ${r.id}" style="color: #94a3b8;"></td>
                        <td>
                            <div th:if="${r.imagePath != null and !#strings.isEmpty(r.imagePath)}">
                                <img th:src="@{'/uploads/roomtypes/' + ${r.imagePath}}" class="room-img"
                                    style="width: 80px; height: 60px; object-fit: cover; border-radius: 8px;"
                                    onerror="this.src='https://placehold.co/80x60?text=No+Image'" />
                                <div th:text="${r.imagePath}" style="font-size:11px;color:#94a3b8;margin-top:6px;">
                                </div>
                            </div>

                            <div th:unless="${r.imagePath != null and !#strings.isEmpty(r.imagePath)}">
                                <div class="placeholder-img"
                                    style="width: 80px; height: 60px; background: #f1f5f9; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 10px; border-radius: 8px; border: 1px dashed #cbd5e1;">
                                    No Image
                                </div>
                                <div style="font-size:11px;color:#94a3b8;margin-top:6px;">
                                    Belum ada gambar â€” <a th:href="@{/admin/roomtypes/edit/{id}(id=${r.id})}"
                                        style="color: #b26a4c; text-decoration: none; font-weight: 600;">Edit</a>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div style="font-weight: 600; color: var(--primary-blue);" th:text="${r.tipe}"></div>
                        </td>
                        <td th:text="${r.lokasi}"></td>
                        <td>
                            <span class="price"
                                th:text="'Rp ' + ${#numbers.formatDecimal(r.price, 0, 'POINT', 0, 'COMMA')}"></span>
                        </td>
                        <td style="text-align: center;">
                            <a th:href="@{/admin/roomtypes/edit/{id}(id=${r.id})}" class="btn btn-edit">Edit</a>
                            <a th:href="@{/admin/roomtypes/delete/{id}(id=${r.id})}"
                                onclick="return confirm('Yakin ingin menghapus?')" class="btn btn-delete">
                                Hapus
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
        <div th:replace="~{fragments/admin-navbar :: back-to-top}"></div>

</body>

</html>
