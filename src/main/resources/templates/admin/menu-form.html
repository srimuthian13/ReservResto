<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Menu | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .wrapper { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 30px; }
        .header { margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .header h2 { color: #0d2c54; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #475569; font-size: 14px; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Inter', sans-serif; }
        input[type="file"] { margin-top: 5px; }
        .btn-submit { background: #0d2c54; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; }
        .btn-submit:hover { background: #1e4d8c; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 14px; }
        .error { color: #ef4444; font-size: 12px; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/admin-navbar :: navbar}"></div>

    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h2 th:text="${menu.id == null ? 'Tambah Menu Baru' : 'Edit Menu'}"></h2>
            </div>
            <form th:action="@{/admin/menus/save}" th:object="${menu}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label>Nama Menu</label>
                    <input type="text" th:field="*{name}" placeholder="Misal: Nasi Goreng Spesial">
                    <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="form-group">
                    <label>Kategori</label>
                    <select th:field="*{category}">
                        <option value="Makanan Utama">Makanan Utama</option>
                        <option value="Makanan Ringan">Makanan Ringan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Dessert">Dessert</option>
                        <option value="Paket Spesial">Paket Spesial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Harga (Rp)</label>
                    <input type="number" th:field="*{price}" min="0" placeholder="0">
                    <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                </div>

                <div class="form-group">
                    <label>Deskripsi (Opsional)</label>
                    <textarea th:field="*{description}" rows="3" placeholder="Jelaskan sedikit tentang menu ini..."></textarea>
                </div>

                <div class="form-group">
                    <label>Foto Menu</label>
                    <div th:if="${menu.imagePath != null}" style="margin-bottom: 10px;">
                        <img th:src="@{'/uploads/menus/' + ${menu.imagePath}}" style="max-width: 150px; border-radius: 8px;">
                    </div>
                    <input type="file" name="imageFile" accept="image/*">
                </div>

                <button type="submit" class="btn-submit">Simpan Menu</button>
                <a th:href="@{/admin/menus}" class="btn-cancel">Batal</a>
            </form>
        </div>
    </div>
</body>
</html>
