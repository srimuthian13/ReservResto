<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manajemen Menu | Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        .wrapper { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: #0d2c54; color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: #b26a4c; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; }
        .btn-add:hover { background: #96573c; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; color: #475569; font-size: 13px; text-transform: uppercase; }
        td img { max-width: 60px; border-radius: 8px; }
        .btn-edit { color: #0ea5e9; text-decoration: none; margin-right: 10px; font-weight: 600; }
        .btn-delete { color: #ef4444; text-decoration: none; font-weight: 600; }
        .alert { padding: 15px; background: #dcfce7; color: #166534; margin-bottom: 20px; border-radius: 8px; }
        .badge { background: #e2e8f0; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: #334155; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/admin-navbar :: navbar}"></div>

    <div class="wrapper">
        <div th:if="${message}" class="alert" th:text="${message}"></div>

        <div class="card">
            <div class="header">
                <h2>Data Menu Makanan</h2>
                <a th:href="@{/admin/menus/add}" class="btn-add">+ Tambah Menu</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nama Menu</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(menus)}">
                        <td colspan="5" style="text-align:center; padding: 30px; color: #94a3b8;">Belum ada data menu.</td>
                    </tr>
                    <tr th:each="m : ${menus}">
                        <td>
                            <img th:if="${m.imagePath != null}" th:src="@{'/uploads/menus/' + ${m.imagePath}}" alt="menu">
                            <span th:if="${m.imagePath == null}" style="color: #cbd5e1; font-size: 12px;">No Image</span>
                        </td>
                        <td style="font-weight: 600;" th:text="${m.name}"></td>
                        <td><span class="badge" th:text="${m.category}"></span></td>
                        <td th:text="'Rp ' + ${#numbers.formatDecimal(m.price, 0, 'POINT', 0, 'COMMA')}"></td>
                        <td>
                            <a th:href="@{/admin/menus/edit/{id}(id=${m.id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/admin/menus/delete/{id}(id=${m.id})}" class="btn-delete" onclick="return confirm('Hapus menu ini?')">Hapus</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:replace="~{fragments/admin-navbar :: back-to-top}"></div>
</body>
</html>
