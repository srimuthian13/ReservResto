<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ReservResto</title>
    <style>
        :root {
            --midnight-blue: #0d2c54;
            --copper: #b26a4c;
            --light-bg: #f4f7f9;
            --text-dark: #2d3436;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--light-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Container utama agar form berada di tengah */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .register-container {
            position: relative;
            width: 100%;
            max-width: 450px;
        }

        /* CARD STYLE: Mengikuti gaya Dashboard Admin */
        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 60px 35px 30px 35px;
            box-shadow: var(--shadow);
            border: 1px solid #edf2f7;
            position: relative;
            overflow: hidden;
            border-left: 6px solid var(--copper);
            /* Aksen garis cokelat */
        }

        /* Ikon Profil di Atas */
        .profile-icon {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background: var(--midnight-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid var(--light-bg);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-icon i {
            color: white;
            font-size: 40px;
        }

        .title-text {
            color: var(--midnight-blue);
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* INPUT GROUPS CUSTOM */
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
        }

        .input-icon {
            background: var(--midnight-blue);
            color: white;
            min-width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px 0 0 10px;
        }

        .form-control {
            flex: 1;
            height: 45px;
            padding: 10px 15px;
            border: 1.5px solid #edf2f7;
            border-radius: 0 10px 10px 0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--copper);
            background: white;
        }

        /* BUTTON REGISTER */
        .btn-register {
            background: var(--midnight-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .btn-register:hover {
            background: #1a4a8a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 44, 84, 0.2);
        }

        /* ERROR MESSAGE STYLE */
        .error-container {
            background: #fff5f5;
            color: #c53030;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #feb2b2;
        }

        .field-error {
            color: #e53e3e;
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            margin-left: 50px;
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: var(--copper);
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .btn-exit {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--midnight-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .btn-exit:hover {
            background: #b26a4c;
            /* Berubah jadi merah saat hover */
            transform: rotate(90deg);
            color: white;
        }

        .btn-exit i {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="main-content">
        <div class="register-container">
            <a th:href="@{/}" class="btn-exit" title="Kembali ke Landing Page" style="text-decoration: none;">
                ✖
            </a>

            <div class="profile-icon">
                👤
            </div>

            <div class="card">
                <h2 class="title-text">Create Account</h2>

                <div class="error-container" th:if="${error != null}" th:text="${error}"></div>

                <form th:action="@{/register}" th:object="${user}" method="post">

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Full Name" required>
                        </div>
                        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Email Address"
                                required>
                        </div>
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">📞</span>
                            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="Phone Number"
                                required>
                        </div>
                        <span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}"
                            th:errors="*{phoneNumber}"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Password"
                                required>
                        </div>
                        <span class="field-error" th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"></span>
                    </div>

                    <button type="submit" class="btn-register">REGISTER</button>
                </form>

                <div class="login-link">
                    Sudah punya akun? <a th:href="@{/login}">Login</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
