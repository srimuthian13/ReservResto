<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Data Reservasi</title>
    <link rel="stylesheet" th:href="@{/css/admin-reservasi-list.css}">
</head>

<body>


    <header>
        <h1>Data Reservasi Pelanggan</h1>
    </header>
    <div th:replace="~{fragments/admin-navbar :: navbar}"></div>

    <div class="container">
        <div class="card">
            <!-- <h1>Data Reservasi Pelanggan</h1> -->

            <div class="toolbar">
                <form th:action="@{/admin/reservasi}" method="get" class="search-box">
                    <input type="text" name="search" th:value="${search}" placeholder="Cari nama atau email..." />
                    <button type="submit" class="btn-search">Cari</button>
                </form>

                <div class="sort-links">
                    Urutkan:
                    <a
                        th:href="@{/admin/reservasi(sort='time',dir=${sort=='time' && dir=='asc' ? 'desc' : 'asc'},search=${search})}">Waktu</a>
                    |
                    <a
                        th:href="@{/admin/reservasi(sort='name',dir=${sort=='name' && dir=='asc' ? 'desc' : 'asc'},search=${search})}">Nama</a>
                    |
                    <a
                        th:href="@{/admin/reservasi(sort='id',dir=${sort=='id' && dir=='asc' ? 'desc' : 'asc'},search=${search})}">ID</a>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User & Kontak</th>
                            <th>Meja</th>
                            <th>Waktu</th>
                            <th>Status Bayar</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reservasiList}">
                            <td th:text="'#' + ${r.idReservasi}" style="font-weight: 600; color: #64748b;"></td>
                            <td>
                                <div style="font-weight: 600;" th:text="${r.user != null ? r.user.name : '-'}"></div>
                                <div style="font-size: 12px; color: #94a3b8;"
                                    th:text="${r.user != null ? r.user.email : '-'}"></div>
                            </td>
                            <td>
                                <div th:text="'Meja ' + ${r.table.tableNo}"></div>
                                <div style="font-size: 12px; color: #94a3b8;" th:text="${r.table.capacity} + ' Kursi'">
                                </div>
                            </td>
                            <td th:text="${#temporals.format(r.reservasiTime, 'dd MMM yyyy HH:mm')}"></td>
                            <td>
                                <span th:class="'status-badge ' + ${r.paymentStatus}"
                                    th:text="${r.paymentStatus}"></span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/admin/reservasi/{id}(id=${r.idReservasi})}"
                                        class="btn-detail">Detail</a>

                                    <a th:if="${r.status != 'CANCELLED'}"
                                        th:href="@{/admin/reservasi/delete/{id}(id=${r.idReservasi})}"
                                        class="btn-cancel" onclick="return confirm('Hapus reservasi ini?')">Hapus</a>
                                    <span th:if="${r.status == 'CANCELLED'}"
                                        style="color: #94a3b8; font-style: italic; font-size: 12px;">Dibatalkan</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/admin-navbar :: back-to-top}"></div>
</body>

</html>
